<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>SenpAI // IoT-Angriffskonsole</title>
    <style>
        :root {
            --bg: #080b0e;
            --panel: #172027;
            --panel-2: #10171d;
            --border: #3a4a56;
            --text: #f1f5f9;
            --dim: #b8c4ce;
            --accent: #6ee7a0;
            --accent-dim: #3f9d67;
            --warn: #ffd166;
        }

        * {
            box-sizing: border-box
        }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font-family: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
            font-size: 18px;
            line-height: 1.7
        }

        /* dezente Scanlines fuer den Terminal-Look */
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 9999;
            background: repeating-linear-gradient(0deg, rgba(255, 255, 255, .025) 0 1px, transparent 1px 3px)
        }

        #chat {
            width: 100%;
            max-width: none;
            margin: 0 auto;
            padding: 0
        }

        header {
            border: 1px solid var(--border);
            border-bottom: none;
            background: var(--panel);
            padding: 22px 26px;
            border-radius: 10px 10px 0 0
        }

        h1 {
            margin: 0;
            font-size: 24px;
            font-weight: 600;
            letter-spacing: .5px;
            color: var(--accent)
        }

        h1 .cursor {
            animation: blink 1.1s step-end infinite
        }

        .subtitle {
            margin-top: 5px;
            color: var(--dim);
            font-size: 15px;
            letter-spacing: 1.5px;
            text-transform: uppercase
        }

        @keyframes blink {
            50% {
                opacity: 0
            }
        }

        #messages {
            height: 70vh;
            max-height: 820px;
            overflow-y: auto;
            background: var(--panel-2);
            padding: 28px;
            border: 1px solid var(--border)
        }

        .message {
            margin-bottom: 16px;
            padding: 14px 16px;
            border-radius: 6px;
            word-wrap: break-word
        }

        .user {
            background: transparent;
            border-left: 2px solid var(--accent)
        }

        .user strong {
            color: var(--accent)
        }

        .ai {
            background: var(--panel);
            border-left: 3px solid var(--border)
        }

        .ai strong {
            color: var(--accent)
        }

        .ai em {
            color: var(--dim);
            font-style: italic
        }

        .ai code {
            background: #1c2330;
            padding: 1px 5px;
            border-radius: 4px;
            font-size: 16px;
            color: var(--warn)
        }

        .log {
            background: transparent;
            padding: 4px 14px;
            margin-bottom: 8px;
            color: var(--dim);
            font-size: 16px;
            border-radius: 0
        }

        .log .ts {
            color: #91a1ad;
            margin-right: 6px
        }

        .log .glyph {
            color: var(--accent)
        }

        .log.warn .glyph {
            color: var(--warn)
        }

        #input-area {
            display: flex;
            gap: 8px;
            padding: 18px;
            background: var(--panel);
            border: 1px solid var(--border);
            border-top: none;
            border-radius: 0 0 10px 10px
        }

        #message {
            flex: 1;
            padding: 16px;
            font-size: 18px;
            font-family: inherit;
            color: var(--text);
            background: var(--panel-2);
            border: 1px solid var(--border);
            border-radius: 5px;
            outline: none
        }

        #message:focus {
            border-color: var(--accent-dim)
        }

        #message::placeholder {
            color: #9aaab6
        }

        #sendButton {
            padding: 16px 24px;
            font-size: 17px;
            font-family: inherit;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: var(--accent);
            background: transparent;
            border: 1px solid var(--accent-dim);
            border-radius: 5px;
            cursor: pointer
        }

        #sendButton:hover {
            background: rgba(74, 222, 128, .12)
        }

        button:disabled {
            opacity: .4;
            cursor: not-allowed
        }

        #suggestions {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 16px
        }

        #attack-suggestions {
            display: contents
        }

        .chip {
            padding: 11px 16px;
            font-size: 16px;
            font-family: inherit;
            color: var(--dim);
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 999px;
            cursor: pointer
        }

        .chip::before {
            content: "\203A  ";
            color: var(--accent)
        }

        .chip:hover {
            color: var(--text);
            border-color: var(--accent-dim)
        }

        #reset-area {
            margin-top: 22px
        }

        #resetButton {
            padding: 12px 18px;
            font-size: 16px;
            font-family: inherit;
            color: var(--dim);
            background: transparent;
            border: 1px solid var(--border);
            border-radius: 5px;
            cursor: pointer
        }

        #resetButton:hover {
            color: var(--text);
            border-color: var(--accent-dim)
        }

        #loading {
            display: none;
            align-items: center;
            gap: 10px;
            margin: 6px 0 16px;
            padding: 4px 14px;
            color: var(--dim);
            font-size: 16px
        }

        #loading.active {
            display: flex
        }

        .spinner {
            width: 16px;
            height: 16px;
            border: 2px solid #2a333d;
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin .7s linear infinite
        }

        @keyframes spin {
            to {
                transform: rotate(360deg)
            }
        }

        #messages::-webkit-scrollbar {
            width: 10px
        }

        #messages::-webkit-scrollbar-track {
            background: var(--panel-2)
        }

        #messages::-webkit-scrollbar-thumb {
            background: #2a333d;
            border-radius: 5px
        }

        @media(max-width:600px) {
            #chat {
                max-width: none;
                margin: 0;
                padding: 0
            }

            #messages {
                height: 58vh
            }
        }
    </style>
</head>

<body>
    <div id="chat">
        <header>
            <h1>SenpAI <span class="cursor">&#9608;</span></h1>
            <div class="subtitle">IoT-Angriffskonsole &middot; Labor-Umgebung &middot; Ziel-Netz 192.168.0.0/24</div>
        </header>
        <div id="messages">
            <div class="message log">
                <span class="ts">--:--:--</span><span class="glyph">[*]</span> SenpAI-Konsole bereit. Stelle eine
                Frage oder waehle ein Ziel aus den Vorschlaegen unten.
            </div>
            <div id="loading">
                <div class="spinner"></div><span>verarbeite ...</span>
            </div>
        </div>
        <div id="input-area">
            <input id="message" type="text" placeholder="Befehl oder Frage eingeben ..." autocomplete="off"
                onkeydown="handleKey(event)">
            <button id="sendButton" onclick="sendMessage()">Senden</button>
        </div>
        <div id="suggestions">
            <button class="chip" onclick="requestIntroduction()">Wer bist du?</button>
            <button class="chip" onclick="sendSuggestion('Starte einen Netzwerk-Scan.')">Netzwerk scannen</button>
        </div>
        <div id="reset-area">
            <button id="resetButton" onclick="resetPage()">Neustart</button>
        </div>
    </div>

    <script>
        let scanCompleted = false;

        // Angriffsvorschläge werden erst nach einem erfolgreichen Netzwerk-Scan eingeblendet.

        function resetPage() {
            window.location.reload();
        }

        function setBusy(busy) {
            document.getElementById("message").disabled = busy;
            document.getElementById("sendButton").disabled = busy;
            document.querySelectorAll(".chip").forEach(function (c) { c.disabled = busy; });
        }

        function timestamp() {
            return new Date().toTimeString().slice(0, 8);
        }

        function sendSuggestion(text) {
            const input = document.getElementById("message");
            if (input.disabled) return;
            input.value = text;
            sendMessage();
        }

        async function requestIntroduction() {
            if (document.getElementById("sendButton").disabled) return;
            setBusy(true);
            showLoading();
            try {
                const response = await fetch("/introduction");
                if (!response.ok) throw new Error("HTTP " + response.status);
                const data = await response.json();
                addMessage("SenpAI", data.text, "ai");
            } catch (error) {
                console.error(error);
                addLog("Einfuehrung konnte nicht geladen werden: " + error.message, "[!]", true);
            }
            hideLoading();
            setBusy(false);
        }

        async function sendMessage() {
            const input = document.getElementById("message");
            const message = input.value.trim();
            if (!message) return;

            setBusy(true);
            addMessage("Du", message, "user");
            input.value = "";
            showLoading();

            let finalMessage = null;
            let finalText = "";

            try {
                const response = await fetch("/chat", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        message: message,
                        scan_completed: scanCompleted
                    })
                });

                if (!response.ok) {
                    throw new Error("Server antwortete mit HTTP " + response.status);
                }

                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                let buffer = "";

                while (true) {
                    const { value, done } = await reader.read();
                    if (done) break;

                    buffer += decoder.decode(value, { stream: true });
                    const events = buffer.split("\n\n");
                    buffer = events.pop();

                    for (const event of events) {
                        if (!event.startsWith("data:")) continue;

                        const json = event.substring(5).trim();
                        if (!json) continue;

                        let data;
                        try {
                            data = JSON.parse(json);
                        } catch {
                            continue;
                        }

                        if (data.type === "thinking") {
                            addLog("Reconnaissance-Modul gestartet: Anfrage wird auf passende Angriffsvektoren geprüft ...", "[*]");
                        }
                        else if (data.type === "status") {
                            addLog(data.text, "[*]");
                        }
                        else if (data.type === "progress") {
                            addLog(data.text, "[*]");
                        }
                        else if (data.type === "completed") {
                            addLog("Operation abgeschlossen. Treffer und Telemetrie werden ausgewertet ...", "[+]");
                            if (data.action === "network_scan" && data.success) {
                                scanCompleted = true;
                                revealAttackSuggestions();
                            }
                        }

                        else if (data.type === "answer_start") {
                            finalText = "";
                            finalMessage = addMessage("SenpAI", "", "ai");
                        }
                        else if (data.type === "token") {
                            if (!finalMessage) {
                                finalMessage = addMessage("SenpAI", "", "ai");
                                finalText = "";
                            }
                            finalText += data.text;
                            finalMessage.innerHTML = "<strong>SenpAI:</strong><br>" + formatText(finalText);
                            scrollToBottom();
                        }
                        else if (data.type === "answer_end") {
                            scrollToBottom();
                        }
                    }
                }
            } catch (error) {
                addLog("Bei der Verarbeitung ist ein Fehler aufgetreten: " + error.message, "[!]", true);
                console.error(error);
            }

            hideLoading();
            setBusy(false);
            input.focus();
        }

        function revealAttackSuggestions() {
            const suggestions = document.getElementById("suggestions");
            if (document.getElementById("attack-suggestions")) return;

            const group = document.createElement("span");
            group.id = "attack-suggestions";
            group.innerHTML =
                '<button class="chip" onclick="sendSuggestion(\'Glühbirne ausschalten\')">Glühbirne ausschalten</button>' +
                '<button class="chip" onclick="sendSuggestion(\'Glühbirne einschalten\')">Glühbirne einschalten</button>' +
                '<button class="chip" onclick="sendSuggestion(\'Türschloss öffnen\')">Türschloss öffnen</button>' +
                '<button class="chip" onclick="sendSuggestion(\'Türschloss schließen\')">Türschloss schließen</button>' +
                '<button class="chip" onclick="sendSuggestion(\'Status des Türschlosses prüfen\')">Schlossstatus prüfen</button>';
            suggestions.appendChild(group);
        }

        function addMessage(sender, text, type) {
            const messages = document.getElementById("messages");
            const loading = document.getElementById("loading");
            const div = document.createElement("div");

            div.className = "message " + type;
            div.innerHTML = "<strong>" + escapeHtml(sender) + ":</strong><br>" + formatText(text);

            messages.insertBefore(div, loading);
            scrollToBottom();

            return div;
        }

        function addLog(text, glyph, warn) {
            const messages = document.getElementById("messages");
            const loading = document.getElementById("loading");
            const div = document.createElement("div");

            div.className = "message log" + (warn ? " warn" : "");
            div.innerHTML = '<span class="ts">' + timestamp() + '</span>'
                + '<span class="glyph">' + escapeHtml(glyph || "[*]") + '</span> '
                + formatText(text);

            messages.insertBefore(div, loading);
            scrollToBottom();

            return div;
        }

        function showLoading() {
            document.getElementById("loading").classList.add("active");
            scrollToBottom();
        }

        function hideLoading() {
            document.getElementById("loading").classList.remove("active");
        }

        function formatText(text) {
            let safe = escapeHtml(text == null ? "" : text).replace(/\r\n?/g, "\n");
            safe = safe.replace(/\*([^*\n]+)\*/g, "<em>$1</em>");
            safe = safe.replace(/`([^`\n]+)`/g, "<code>$1</code>");
            return safe.replace(/\n/g, "<br>");
        }

        function escapeHtml(text) {
            const div = document.createElement("div");
            div.textContent = text;
            return div.innerHTML;
        }

        function scrollToBottom() {
            const messages = document.getElementById("messages");
            messages.scrollTop = messages.scrollHeight;
        }

        function handleKey(event) {
            if (event.key === "Enter" && !event.shiftKey) {
                event.preventDefault();
                sendMessage();
            }
        }
    </script>
</body>

</html>
